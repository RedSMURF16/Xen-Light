#==============================================#
# Xen Light by RedSMURF: Configuration file #
#==============================================#

# To add a new light, follow the example below
# [Light Name]
# LIGHT_FLAGS                    = a - Solid            b - Active Delay        c - Active Duration
# LIGHT_TEAM                     = 0 - None             1 - Terrorist           2 - Counter-Terrorist   3 - Both
# LIGHT_FRAMERATE                = Light's animation speed

# LIGHT_SPAWN_CHANCE             = light's respawn probability (0.0 = never, 1.0 = always)
# LIGHT_ACTIVE_DELAY             = Delay in seconds before the light becomes active at round start
# LIGHT_ACTIVE_DURATION          = Duration of the active state in seconds
# LIGHT_ACTIVE_COOLDOWN          = Cooldown in seconds before the light becomes active again
# LIGHT_GLOW_SPRITE              = Path to the sprite used for the light's glow effect
# LIGHT_GLOW_FRAMERATE           = Glow sprite's animation speed
# LIGHT_GLOW_SCALE               = Scale of the glow sprite (0.0 = invisible, 1.0 = normal size)
# LIGHT_GLOW_ALPHA               = Transparency of the glow sprite (0 - 255)
# LIGHT_HIDE_DISTANCE            = Distance in units at which the glow sprite becomes invisible
# LIGHT_HIDE_DURATION            = Duration in seconds before the glow sprite becomes invisible

# To make an light available in the menu, you must defined at least it's name like this [RedSMURF's Light]
# light model and sound cannot be changed dynamically during gameplay

